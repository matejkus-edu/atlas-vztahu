<!doctype html>
<html lang="cs">
<head>

<title>Kauza Vypnutý mikrofon</title>

<style>
/* Layout: spis (case file) — sticky case bar with stepper + timer, one stage per screen, evidence cards and chat transcripts, code lock at the foot of each stage. */
:root {
  --paper: #eef1f5;
  --card: #ffffff;
  --ink: #161d2e;
  --muted: #5a6478;
  --line: #d6dce6;
  --accent: #2a55c0;
  --accent-soft: #e3eafb;
  --tag: #f3c443;
  --tag-ink: #2b2206;
  --ok: #1d8656;
  --ok-soft: #e1f3ea;
  --bad: #c03b34;
  --bad-soft: #fbe7e5;
  --warn: #b7791f;
  --chat: #252a3d;
  --chat-2: #2f3550;
  --chat-fg: #e5e8f2;
  --chat-muted: #9ba3bd;
  --shadow: 0 1px 2px rgba(22,29,46,.06), 0 4px 14px rgba(22,29,46,.06);
  --f-display: "Exo 2", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131e; --card: #161d2b; --ink: #e6e9f0; --muted: #9aa3b6; --line: #2a3346;
    --accent: #84a5ff; --accent-soft: #1d2a4a; --tag: #e7bb3a; --tag-ink: #241c03;
    --ok: #4cc38a; --ok-soft: #12301f; --bad: #f0736a; --bad-soft: #3a1714; --warn: #e3a948;
    --chat: #0b0f19; --chat-2: #151b2b; --chat-fg: #e5e8f2; --chat-muted: #8e97b0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131e; --card: #161d2b; --ink: #e6e9f0; --muted: #9aa3b6; --line: #2a3346;
  --accent: #84a5ff; --accent-soft: #1d2a4a; --tag: #e7bb3a; --tag-ink: #241c03;
  --ok: #4cc38a; --ok-soft: #12301f; --bad: #f0736a; --bad-soft: #3a1714; --warn: #e3a948;
  --chat: #0b0f19; --chat-2: #151b2b; --chat-fg: #e5e8f2; --chat-muted: #8e97b0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* case bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { display: block; font-family: var(--f-mono); font-size: .68rem; color: var(--muted); letter-spacing: .08em; }
.meta { display: flex; align-items: center; gap: 12px; }
.clock { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.clock.late { color: var(--warn); }
.tokens { display: flex; gap: 4px; align-items: center; }
.tok { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--tag); display: grid; place-items: center; }
.tok.used { opacity: .25; }
.steps { flex-basis: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.step { border: 0; background: var(--paper); border-radius: 8px; padding: 6px 8px; text-align: left; font-size: .78rem; line-height: 1.2; color: var(--muted); display: flex; gap: 6px; align-items: center; min-width: 0; }
.step i { font-style: normal; font-family: var(--f-mono); font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink); flex: none; font-size: .72rem; }
.step span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step.cur { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.step.cur i { background: var(--accent); color: var(--card); }
.step.done i { background: var(--ok); color: var(--card); }
.step:disabled { cursor: default; }
@media (max-width: 520px) { .step span { display: none; } .step { justify-content: center; } }

/* blocks */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.plain { display: flex; flex-direction: column; gap: 12px; }
.concept { background: var(--accent-soft); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.concept .eyebrow { color: var(--accent); }
.concept p { max-width: 65ch; }
.stage-head { display: flex; flex-direction: column; gap: 6px; padding-top: 22px; }
.stage-head p { max-width: 60ch; color: var(--muted); }

.evidence { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ev { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.ev .tag { align-self: flex-start; background: var(--tag); color: var(--tag-ink); font-family: var(--f-mono); font-size: .68rem; font-weight: 700; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
.ev small { color: var(--muted); font-style: italic; }

/* transcripts */
.convo { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.convo-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--paper); }
.convo-h b { font-family: var(--f-display); font-size: 1.05rem; }
.convo-h span { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.lines { list-style: none; margin: 0; padding: 8px 0; }
.lines li { padding: 6px 14px; display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
.lines .who { font-weight: 600; font-size: .9rem; }
.lines .act { color: var(--muted); font-style: italic; }
.convo.discord { background: var(--chat); border-color: var(--chat); color: var(--chat-fg); }
.convo.discord .convo-h { background: var(--chat-2); border-color: transparent; }
.convo.discord .convo-h span { color: var(--chat-muted); }
.convo.discord .lines li { grid-template-columns: 22px 64px 1fr; }
.convo.discord .num { font-family: var(--f-mono); color: var(--chat-muted); font-size: .78rem; padding-top: 2px; }
.convo.discord .act { color: var(--chat-muted); }
.convo.discord .who.kuba { color: #f29d6b; }
.convo.discord .who.simon { color: #7fc8ff; }
.convo.discord .who.matyas { color: #9be08a; }
.pick-lines li { cursor: pointer; border-left: 3px solid transparent; }
.pick-lines li:hover { background: var(--chat-2); }
.pick-lines li.on { background: rgba(243,196,67,.16); border-left-color: var(--tag); }
.pick-lines[aria-disabled="true"] li { cursor: default; }

/* form */
.task { display: flex; flex-direction: column; gap: 16px; }
.q { display: flex; flex-direction: column; gap: 8px; }
.q > label, .q > .ql { font-weight: 600; }
.q .hint { font-size: .85rem; color: var(--muted); }
textarea, input[type=text] { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 76px; resize: vertical; }
textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .9rem; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.seg button:disabled { cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.axis-grid { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
.axis-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.axis-row .an { font-weight: 600; font-size: .92rem; }
.axis-row .an small { display: block; font-weight: 400; color: var(--muted); }
@media (max-width: 600px) { .axis-row { grid-template-columns: 1fr; } }
.axes { display: flex; flex-direction: column; gap: 8px; }
.axes details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
.axes summary { cursor: pointer; padding: 11px 0; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; list-style: none; }
.axes summary::-webkit-details-marker { display: none; }
.axes summary em { font-style: normal; color: var(--muted); font-weight: 400; font-size: .88rem; }
.axes .poles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 12px; }
.axes .pole { background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: .92rem; }
.axes .pole b { display: block; font-family: var(--f-display); margin-bottom: 2px; }
.axes .note { grid-column: 1 / -1; font-size: .86rem; color: var(--muted); }
@media (max-width: 560px) { .axes .poles { grid-template-columns: 1fr; } }
.pairs { display: flex; flex-direction: column; gap: 10px; }
.pair { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; gap: 8px 12px; align-items: center; background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.pair .n { font-family: var(--f-mono); color: var(--muted); }
.pair q { quotes: "„" "“"; }
.pair .pl { display: block; }
@media (max-width: 560px) { .pair { grid-template-columns: 22px minmax(0,1fr); } .pair .seg { grid-column: 2; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; }
.legend b { font-family: var(--f-mono); }

/* lock */
.lock { border: 2px dashed var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
.lock-h { display: flex; align-items: center; gap: 10px; }
.lock-h h3 { font-size: 1rem; }
.lock .code-in { font-family: var(--f-mono); font-size: 1.4rem; letter-spacing: .3em; text-transform: uppercase; max-width: 220px; text-align: center; }
.lock-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 600; background: var(--accent); color: var(--card); min-height: 44px; font-family: var(--f-display); letter-spacing: .02em; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.big { font-size: 1.1rem; padding: 14px 22px; }
.msg { border-radius: 10px; padding: 10px 14px; font-size: .95rem; }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.msg.info { background: var(--accent-soft); }
.msg.tip { background: var(--paper); border-left: 4px solid var(--tag); }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.stamp { align-self: flex-start; font-family: var(--f-display); font-weight: 800; letter-spacing: .14em; color: var(--ok); border: 3px solid var(--ok); border-radius: 6px; padding: 4px 12px; transform: rotate(-4deg); text-transform: uppercase; }
.missing { font-size: .85rem; color: var(--muted); }

/* setup */
.cover { padding-top: 28px; display: flex; flex-direction: column; gap: 16px; }
.cover .lede { font-size: 1.1rem; max-width: 56ch; }
.case-file { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
.case-file .mic { width: 64px; height: 64px; border-radius: 14px; background: var(--chat); display: grid; place-items: center; }
@media (max-width: 520px) { .case-file { grid-template-columns: 1fr; } }
.members { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .members { grid-template-columns: 1fr; } }

/* chat composer */
.compose { background: var(--chat); border-radius: 14px; padding: 14px; color: var(--chat-fg); display: flex; flex-direction: column; gap: 10px; }
.compose .to { font-family: var(--f-mono); font-size: .78rem; color: var(--chat-muted); display: flex; gap: 8px; align-items: center; }
.compose .dot { width: 8px; height: 8px; border-radius: 50%; background: #4cc38a; }
.compose textarea { background: var(--chat-2); border-color: transparent; color: var(--chat-fg); min-height: 96px; }
.compose .count { font-family: var(--f-mono); font-size: .75rem; color: var(--chat-muted); align-self: flex-end; }
.typing { font-family: var(--f-mono); font-size: .82rem; color: var(--chat-muted); }
.typing s { opacity: .7; }
.checks { display: flex; flex-direction: column; gap: 8px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.checks input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }

.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: .82rem; color: var(--muted); padding-top: 12px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: .82rem; }
.banner { background: var(--tag); color: var(--tag-ink); border-radius: 10px; padding: 8px 12px; font-size: .85rem; }

/* teacher */
.tw { max-width: 1100px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
td.t { font-family: var(--f-mono); }
td.pend { color: var(--muted); }
.rank { font-family: var(--f-display); font-weight: 800; }
.msgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.mcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mcard .bubble { background: var(--chat); color: var(--chat-fg); border-radius: 12px 12px 12px 4px; padding: 10px 12px; }
.mcard .why { font-size: .9rem; color: var(--muted); }
.projector .mcard { font-size: 1.35rem; }
.projector .msgs { grid-template-columns: 1fr; }
.projector .hide-proj { display: none !important; }
.det { font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
.det dt { font-weight: 600; }
.det dd { margin: 0 0 6px; color: var(--muted); white-space: pre-wrap; }
.keygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.key { background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.key b { font-family: var(--f-mono); font-size: 1.2rem; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } * { scroll-behavior: auto !important; } }
</style>

<div id="app"></div>

  app.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.t === 'login') { T.pin = document.getElementById('pin').value.trim(); loadTeacher(); }
    if (t.dataset.t === 'refresh') { var d = document.getElementById('tdate'); if (d) T.datum = d.value.trim(); loadTeacher(); }
    if (t.dataset.t === 'proj') { T.proj = !T.proj; teacher(); window.scrollTo(0, 0); }
    if (t.dataset.tt) { T.trida = t.dataset.tt; teacher(); }
  });
  setInterval(function () { if (T.pin && hasBackend) loadTeacher(); }, 20000);
}

/* ---------- start ---------- */
function boot(isTeacher) {
  if (isTeacher) { document.title = 'Kauza Vypnutý mikrofon · učitel'; teacherEvents(); teacher(); }
  else render();
}
if (hasGAS && google.script.url) {
  google.script.url.getLocation(function (loc) { boot(!!(loc.parameter && loc.parameter.ucitel != null) || /ucitel/.test(loc.hash || '')); });
} else {
  boot(/ucitel/.test(location.hash) || /ucitel/.test(location.search));
  window.addEventListener('hashchange', function () { location.reload(); });
}
})();
</script>
</html>
